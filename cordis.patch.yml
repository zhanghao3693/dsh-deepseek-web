# dsh-deepseek-web bundle patch
#
# 声明 dsh.bundle.patch 之后，官方/桌面端插件管理器（@deepseek-ai/dsh-plugin-manager）
# 才会把本包当成 profile 的一层 layer：installBundle 会把它追加进
# profile 的 `dsh.profile.bundles`，profile 启动时再把下面的 insert 合并进插件树。
#
# 为什么必须有这个文件：reconcile() 只保留「在 bundles 里且能读到 dsh.bundle.patch」
# 的条目；没有它，本包会连同整个 bundles 列表一起被删掉。
#
# 注意：不要再在 profile 自己的 cordis.patch.yml 里重复 insert 同一个 id —— 那会重复挂载
# （两个 host 半边、两个按钮）。
- insert:
    - id: deepseek-web
      # 这里是 **Loader 行名**，必须与 package.json 的 name 逐字相等：
      # dsh-client-modules 的 nearestPackage() 用「行名 == package.json name」
      # 判定包归属，对不上就静默丢弃 client 半边（按钮消失、控制台无报错）。
      name: "@dpharness/dsh-deepseek-web"
